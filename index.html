<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ficha Sensorial de Cacao</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>ANÁLISIS SENSORIAL DE CACAO</h1>
    <h2>Ficha de Catación</h2>
  
    <form id="fichaForm">
  
      <!-- Información general -->
      <div class="section datos-generales">
        <label>Muestra: <input type="text" name="muestra" required></label>
        <label>Catador: <input type="text" name="catador" required></label>
        <label>Fecha: <input type="date" name="fecha" required></label>
      </div>
  
      <!-- Tabla de evaluación -->
      <table class="ficha">
        <thead>
          <tr>
            <th>Categorías</th>
            <th>Intensidad (0-5)</th>
            <th>Descriptores</th>
            <th>Calidad (0-10)</th>
            <th>Puntaje</th>
          </tr>
        </thead>
        <tbody>
          <!-- Atributos generales -->
          <tr>
            <td>Aroma</td>
            <td><input type="range" name="aroma_int" min="0" max="5" value="0" oninput="updateSlider(this)"><span>0</span></td>
            <td><input type="text" name="aroma_desc"></td>
            <td><input type="number" name="aroma_qual" min="0" max="10"></td>
            <td><input type="number" name="aroma_score" readonly></td>
          </tr>
          <tr>
            <td>Acidez</td>
            <td><input type="range" name="acidez_int" min="0" max="5" value="0" oninput="updateSlider(this)"><span>0</span></td>
            <td><input type="text" name="acidez_desc"></td>
            <td><input type="number" name="acidez_qual" min="0" max="10"></td>
            <td><input type="number" name="acidez_score" readonly></td>
          </tr>
          <tr>
            <td>Amargor</td>
            <td><input type="range" name="amargor_int" min="0" max="5" value="0" oninput="updateSlider(this)"><span>0</span></td>
            <td><input type="text" name="amargor_desc"></td>
            <td><input type="number" name="amargor_qual" min="0" max="10"></td>
            <td><input type="number" name="amargor_score" readonly></td>
          </tr>
          <tr>
            <td>Astringencia</td>
            <td><input type="range" name="astringencia_int" min="0" max="5" value="0" oninput="updateSlider(this)"><span>0</span></td>
            <td><input type="text" name="astringencia_desc"></td>
            <td><input type="number" name="astringencia_qual" min="0" max="10"></td>
            <td><input type="number" name="astringencia_score" readonly></td>
          </tr>
  
          <!-- Defectos (se multiplican x2) -->
          <tr>
            <td>Defectos</td>
            <td><input type="range" name="defectos_int" min="0" max="5" value="0" oninput="updateSlider(this)"><span>0</span></td>
            <td><input type="text" name="defectos_desc"></td>
            <td><input type="number" name="defectos_qual" min="0" max="10"></td>
            <td><input type="number" name="defectos_score" readonly></td>
          </tr>
  
          <!-- Sabor subdividido (x2) -->
          <tr>
            <td colspan="5"><strong>Sabor</strong></td>
          </tr>
          <tr>
            <td>Cacao</td>
            <td><input type="range" name="sabor_cacao" min="0" max="5" value="0" oninput="updateSlider(this)"><span>0</span></td>
            <td colspan="3"></td>
          </tr>
          <tr>
            <td>Dulce</td>
            <td><input type="range" name="sabor_dulce" min="0" max="5" value="0" oninput="updateSlider(this)"><span>0</span></td>
            <td colspan="3"></td>
          </tr>
          <!-- puedes continuar con Frutas, Floral, Especias, etc. -->
  
          <tr>
            <td>Posgusto</td>
            <td><input type="range" name="posgusto_int" min="0" max="5" value="0" oninput="updateSlider(this)"><span>0</span></td>
            <td><input type="text" name="posgusto_desc"></td>
            <td><input type="number" name="posgusto_qual" min="0" max="10"></td>
            <td><input type="number" name="posgusto_score" readonly></td>
          </tr>
        </tbody>
      </table>
  
      <!-- Comentarios -->
      <label>Comentarios:
        <textarea name="comentarios" rows="4" placeholder="Notas, observaciones…"></textarea>
      </label>
  
      <!-- Puntajes -->
      <div class="puntuacion">
        <label>Puntos de catador: <input type="number" name="catador_score" readonly></label>
        <label>PUNTAJE FINAL: <input type="number" name="puntaje_final" readonly></label>
      </div>
  
      <button type="submit">Guardar</button>
    </form>
  
    <script src="script.js"></script>
  </body>
  </html>
